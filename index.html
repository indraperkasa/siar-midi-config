<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIAR-MIDI Configurator Tool</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; padding: 30px; text-align: center; }
        
        /* Logo Header Styling */
        .header-logo-container {
            margin: 30px auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header-logo {
            height: 300px;          /* Balanced title-replacement height */
            width: auto;
            max-width: 100%;
        }

        .status-container { margin: 20px auto; padding: 15px; width: 320px; border-radius: 6px; background: #1e1e1e; border: 1px solid #333; }
        .btn { background: #00adb5; color: #fff; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #00f5ff; color: #000; }
        
        .channel-manager { display: flex; justify-content: center; gap: 20px; margin: 25px auto; max-width: 640px; background: #1a1a1a; padding: 15px; border-radius: 6px; border: 1px dashed #444; }
        .chan-block { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: bold; text-align: left; }
        
        .deck-grid { display: flex; justify-content: center; gap: 40px; margin-top: 20px; flex-wrap: wrap; }
        .bank-card { background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #292929; width: 280px; }
        .bank-card h2 { margin-top: 0; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        label { font-weight: 600; color: #aaaaaa; }
        select { background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 4px; width: 85px; text-align: center; }
    </style>
</head>
<body>

    <div class="header-logo-container">
        <!-- Change 'logo.png' to your actual file name if it's different -->
        <img src="siar-midi-logo.png" alt="SIAR-MIDI Logo" class="header-logo">
    </div>
    
    <p style="margin-top: 0; margin-bottom: 25px; color: #aaaaaa;">configure midi cc and channel.</p>

    <div class="status-container">
        <div id="statusText" style="color: #ff5722; margin-bottom: 10px;">Status: Disconnected</div>
        <button class="btn" id="connectBtn">CONNECT CONTROLLER</button>
    </div>

    <!-- GLOBAL MIDI CHANNEL MANAGEMENT MATRIX -->
    <div class="channel-manager">
        <div class="chan-block">
            <label style="color: #ff3b30;">BLE 1</label>
            <select class="chan-select" data-type="0" data-bank="0" id="b1_ble"></select>
        </div>
        <div class="chan-block">
            <label style="color: #ff3b30;">TRS 1</label>
            <select class="chan-select" data-type="1" data-bank="0" id="b1_trs"></select>
        </div>
        <div class="chan-block" style="border-left: 2px solid #333; padding-left: 15px;">
            <label style="color: #4cd964;">BLE 2</label>
            <select class="chan-select" data-type="0" data-bank="1" id="b2_ble"></select>
        </div>
        <div class="chan-block">
            <label style="color: #4cd964;">TRS 2</label>
            <select class="chan-select" data-type="1" data-bank="1" id="b2_trs"></select>
        </div>
    </div>

    <div class="deck-grid">
        <div class="bank-card" style="border-top: 4px solid #ff3b30;">
            <h2>BANK 1 (Red LED)</h2>
            <div id="bank1-rows"></div>
        </div>
        <div class="bank-card" style="border-top: 4px solid #4cd964;">
            <h2>BANK 2 (Green LED)</h2>
            <div id="bank2-rows"></div>
        </div>
    </div>

    <script>
        let port = null;
        let writer = null;

        function buildInterfaceElements() {
            // 1. Build Global Channel Selector Matrices
            const channelSelects = document.querySelectorAll('.chan-select');
            channelSelects.forEach(select => {
                const isBLE = select.dataset.type === "0";
                const isBank1 = select.dataset.bank === "0";

                for (let ch = 1; ch <= 16; ch++) {
                    const opt = document.createElement('option');
                    // BLE uses 0-indexed values (0-15), TRS uses literals (1-16)
                    opt.value = isBLE ? (ch - 1) : ch;
                    opt.textContent = `Ch ${ch}`;
                    
                    if (isBank1 && isBLE && ch === 1) opt.selected = true;
                    if (isBank1 && !isBLE && ch === 1) opt.selected = true;
                    if (!isBank1 && isBLE && ch === 2) opt.selected = true;
                    if (!isBank1 && !isBLE && ch === 2) opt.selected = true;
                    
                    select.appendChild(opt);
                }
                select.addEventListener('change', pushChannelModificationData);
            });

            // 2. Build Component Knob Rows
            for (let bank = 0; bank < 2; bank++) {
                const container = document.getElementById(`bank${bank + 1}-rows`);
                for (let knob = 0; knob < 5; knob++) {
                    const row = document.createElement('div');
                    row.className = 'control-row';
                    const label = document.createElement('label');
                    label.textContent = `Knob ${knob + 1} CC:`;
                    const select = document.createElement('select');
                    select.dataset.bank = bank; select.dataset.knob = knob;
                    
                    for (let cc = 0; cc <= 127; cc++) {
                        const opt = document.createElement('option');
                        opt.value = cc; opt.textContent = cc;
                        if (bank === 0 && cc === (knob + 1)) opt.selected = true;
                        if (bank === 1 && knob === 4 && cc === 35) opt.selected = true;
                        if (bank === 1 && knob < 4 && cc === (knob + 6)) opt.selected = true;
                        select.appendChild(opt);
                    }
                    select.addEventListener('change', pushNewAssignmentData);
                    row.appendChild(label); row.appendChild(select); container.appendChild(row);
                }
            }
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            if (!("serial" in navigator)) { alert("Web Serial unsupported in this browser."); return; }
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                writer = port.writable.getWriter();
                document.getElementById('statusText').textContent = "Status: Connected Successfully";
                document.getElementById('statusText').style.color = "#4cd964";
                document.getElementById('connectBtn').style.display = "none";
            } catch (err) { alert("Connection failed."); }
        });

        async function pushNewAssignmentData(event) {
            if (!writer) return;
            // FIXED: Explicitly casting values to integers to prevent transmission format mismatch
            const bank = parseInt(event.target.dataset.bank, 10);
            const knob = parseInt(event.target.dataset.knob, 10);
            const chosenCC = parseInt(event.target.value, 10);
            
            const commandPayload = `SET,${bank},${knob},${chosenCC}\n`;
            const encoder = new TextEncoder();
            await writer.write(encoder.encode(commandPayload));
            console.log("Sent CC Command:", commandPayload);
        }

        async function pushChannelModificationData(event) {
            if (!writer) return;
            // FIXED: Explicitly casting values to integers to match firmware parser requirements
            const type = parseInt(event.target.dataset.type, 10);
            const bank = parseInt(event.target.dataset.bank, 10);
            const targetChannel = parseInt(event.target.value, 10);
            
            const commandPayload = `CH,${type},${bank},${targetChannel}\n`;
            const encoder = new TextEncoder();
            await writer.write(encoder.encode(commandPayload));
            console.log("Sent Channel Command:", commandPayload);
        }

        window.onload = buildInterfaceElements;
    </script>
</body>
</html>
